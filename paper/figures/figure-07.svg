<svg viewBox="0 0 680 270" width="100%" style="max-width:680px;background:#fff" role="img" aria-label="Diagram: leftover sizes, holiday and sale connect to explain a sales spike" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker></defs><rect x="20" y="20" width="180" height="58" rx="10" fill="#f4f4f1" stroke="#b8b7b0" stroke-width="1"/><text x="110.0" y="45" font-size="14" font-weight="600" fill="#0b0b0b" text-anchor="middle">Season</text><text x="110.0" y="64" font-size="12" fill="#52514e" text-anchor="middle">time of year</text><rect x="250" y="20" width="180" height="58" rx="10" fill="#f4f4f1" stroke="#b8b7b0" stroke-width="1"/><text x="340.0" y="45" font-size="14" font-weight="600" fill="#0b0b0b" text-anchor="middle">Holiday</text><text x="340.0" y="64" font-size="12" fill="#52514e" text-anchor="middle">a sale date is coming</text><rect x="20" y="150" width="180" height="58" rx="10" fill="#f4f4f1" stroke="#b8b7b0" stroke-width="1"/><text x="110.0" y="175" font-size="14" font-weight="600" fill="#0b0b0b" text-anchor="middle">Leftover sizes</text><text x="110.0" y="194" font-size="12" fill="#52514e" text-anchor="middle">only M, L, XL remain</text><rect x="250" y="150" width="180" height="58" rx="10" fill="#f4f4f1" stroke="#b8b7b0" stroke-width="1"/><text x="340.0" y="175" font-size="14" font-weight="600" fill="#0b0b0b" text-anchor="middle">Sale</text><text x="340.0" y="194" font-size="12" fill="#52514e" text-anchor="middle">colour is discounted</text><rect x="480" y="150" width="180" height="58" rx="10" fill="#eaf2fc" stroke="#2a78d6" stroke-width="1"/><text x="570.0" y="175" font-size="14" font-weight="600" fill="#0b0b0b" text-anchor="middle">Sales spike, then stop</text><text x="570.0" y="194" font-size="12" fill="#52514e" text-anchor="middle">only in the sizes left</text><line x1="200" y1="49" x2="248" y2="49" stroke="#52514e" stroke-width="1.5" marker-end="url(#ah)"/><line x1="340" y1="78" x2="340" y2="148" stroke="#52514e" stroke-width="1.5" marker-end="url(#ah)"/><text x="346.0" y="117.0" font-size="12" fill="#8a8984">timed for</text><line x1="200" y1="179" x2="248" y2="179" stroke="#52514e" stroke-width="1.5" marker-end="url(#ah)"/><line x1="430" y1="179" x2="478" y2="179" stroke="#52514e" stroke-width="1.5" marker-end="url(#ah)"/><path d="M110,208 C110,260 570,260 570,210" fill="none" stroke="#52514e" stroke-width="1.5" marker-end="url(#ah)"/><text x="340" y="258" font-size="12" fill="#8a8984" text-anchor="middle">limits what can sell</text></svg>