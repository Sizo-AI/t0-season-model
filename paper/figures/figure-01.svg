<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 680 150" width="100%" style="max-width:680px;background:#fff" role="img" aria-label="How the model works" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif"><rect x="0" y="30" width="150" height="90" rx="10" fill="#f4f3ef" stroke="#e6e5e0"/><text x="75.0" y="63" font-size="14" fill="#0b0b0b" font-weight="600" text-anchor="middle">Store data</text><text x="75.0" y="80" font-size="12" fill="#52514e" font-weight="400" text-anchor="middle">sales, stock,</text><text x="75.0" y="97" font-size="12" fill="#52514e" font-weight="400" text-anchor="middle">discounts, launches</text><line x1="150" y1="75" x2="174" y2="75" stroke="#8a8984" stroke-width="2"/><path d="M172,70 L180,75 L172,80 z" fill="#8a8984"/><rect x="180" y="30" width="150" height="90" rx="10" fill="#f4f3ef" stroke="#e6e5e0"/><text x="255.0" y="63" font-size="14" fill="#0b0b0b" font-weight="600" text-anchor="middle">Input rows</text><text x="255.0" y="80" font-size="12" fill="#52514e" font-weight="400" text-anchor="middle">last season + recent</text><text x="255.0" y="97" font-size="12" fill="#52514e" font-weight="400" text-anchor="middle">weeks, side by side</text><line x1="330" y1="75" x2="354" y2="75" stroke="#8a8984" stroke-width="2"/><path d="M352,70 L360,75 L352,80 z" fill="#8a8984"/><rect x="360" y="20" width="170" height="110" rx="10" fill="#e8f1fc" stroke="#2a78d6"/><text x="445.0" y="63" font-size="14" fill="#0b0b0b" font-weight="600" text-anchor="middle">t0-gamma</text><text x="445.0" y="80" font-size="12" fill="#52514e" font-weight="400" text-anchor="middle">frozen, 256M</text><text x="445.0" y="97" font-size="12" fill="#52514e" font-weight="400" text-anchor="middle">+ our LoRA (4%)</text><line x1="530" y1="75" x2="554" y2="75" stroke="#8a8984" stroke-width="2"/><path d="M552,70 L560,75 L552,80 z" fill="#8a8984"/><rect x="560" y="30" width="120" height="90" rx="10" fill="#f4f3ef" stroke="#e6e5e0"/><text x="620.0" y="63" font-size="14" fill="#0b0b0b" font-weight="600" text-anchor="middle">Season total</text><text x="620.0" y="80" font-size="12" fill="#52514e" font-weight="400" text-anchor="middle">per colour,</text><text x="620.0" y="97" font-size="12" fill="#52514e" font-weight="400" text-anchor="middle">0–26 weeks ahead</text></svg>